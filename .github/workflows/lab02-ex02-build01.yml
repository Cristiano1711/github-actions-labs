name: Lab02 Ex02 - Build V1
on:
  push:
    paths:
      - 'lab02-ex02/**'
      - '.github/workflows/lab02-ex02-*.yml'
defaults:
  run:
    working-directory: lab02-ex02
jobs:
 deploy:
   runs-on: ubuntu-latest
   steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install dependencies
       run: npm ci
     - name: Lint
       run: npm run lint
     - name: Test code
       run: npm run test
     - name: Build code
       run: npm run build
     - name: Deploy code
       run: echo "Deploying..."
