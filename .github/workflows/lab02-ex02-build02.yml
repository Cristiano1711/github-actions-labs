name: Lab02 Ex02 - Build V2
on:
  push:
    paths:
      - 'lab02-ex02/**'
      - '.github/workflows/lab02-ex02-*.yml'
defaults:
  run:
    working-directory: lab02-ex02
jobs:
 lint:
   runs-on: ubuntu-latest
   steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install dependencies
       run: npm ci
     - name: Lint
       run: npm run lint
 test:
   needs: lint
   runs-on: ubuntu-latest
   steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install dependencies
       run: npm ci
     - name: Test code
       run: npm run test
 deploy:
   needs: test
   runs-on: ubuntu-latest
   steps:
     - name: Get code
       uses: actions/checkout@v3
     - name: Install dependencies
       run: npm ci
     - name: Build code
       run: npm run build
     - name: Deploy code
       run: echo "Deploying..."
