name: Lab02 Ex01 - Simple Local
on:
  push:
    paths:
      - 'lab02-ex01/**'
      - '.github/workflows/lab02-ex01-build.yml'
jobs:
   build-node:
       runs-on: ubuntu-latest
       container: node:18
       defaults:
         run:
           working-directory: lab02-ex01
       steps:
           - run: node --version
           - run: npm --version
           - uses: actions/checkout@v3
           - run: npm install
           - run: npm install --save moment
           - run: node app.js
